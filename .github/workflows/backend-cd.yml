name: 'Backend Deployment Pipeline'
on:
  # Manual trigger
  workflow_dispatch:

  # Automatic trigger on pull_request events
  push:
    branches:
      - main
      - movie-branch
#    paths:
#      - 'frontend/**' # Le pipeline backend se déclenchera uniquement si le code du frontend change

jobs:
    
  # linting job that fails if the code contain error
  # ==========================================
  # JOB 1 : LINTING 
  # ==========================================
  lint:
    name: Run Linting job
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ou '3.x' pour la dernière version stable

      
      # 3. Installer le linter (et les dépendances si nécessaire)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # 4. Exécution du linter dans le dossier backend
      # Retourne un code d'erreur (exit 1) si le code n'est pas propre
      - name: Run Flake8 Check
        run: flake8 starter/backend --max-line-length=127

  # ==========================================
  # JOB 2 : TESTS 
  # ==========================================

  # parallel test job that fails if test suit doesn't pass 
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Installer Pipenv
      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      # 2. Installer les dépendances backend depuis Pipfile.lock
      - name: Install Backend Dependencies
        run: pipenv install --dev
        working-directory: starter/backend

      # 3. Lancer pytest au sein de l'environnement virtuel Pipenv
      - name: Run Backend Tests with Pytest
        run: pipenv run pytest
        working-directory: starter/backend

  # ==========================================
  # JOB 3 : BUILD DOCKER & PUSH TO ECR
  # ==========================================
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: [lint, tests] # On ne build l'image QUE si les tests passent !
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à AWS (Utilise les Secrets de votre dépôt GitHub)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Authentifier Docker auprès de votre registre ECR privé
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construire l'image et la pousser (C'est le bloc que nous avons vu ensemble)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: starter/backend
          push: true # 'true' car on veut l'envoyer sur AWS maintenant
          # Récupère l'URL ECR générée dynamiquement à l'étape précédente + le nom de votre repo
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}
          build-args: |
            REACT_APP_MOVIE_API_URL=http://localhost:5000

  # ==========================================
  # JOB 4 : DEPLOY TO K8S
  # ==========================================
  deploy:
    name: Deploy Backend to Amazon EKS
    runs-on: ubuntu-latest
    needs: [build-and-push] # On ne déploie que si le build ECR a réussi
    
    steps:
      # 1. Récupérer le code et les manifests
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Configurer kubectl pour pointer vers le cluster EKS
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name udacity_cluster
      # 4. Mettre à jour l'image du backend avec le tag (Git SHA ou latest)
      - name: Set Image Tag for Backend
        run: |
          kustomize edit set image backend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}
        working-directory: starter/backend/k8s

      # 5. Appliquer les manifests du backend sur le cluster
      - name: Deploy Backend Manifests to Kubernetes
        run: |
          # Si Kustomize :
          kubectl apply -k .
        working-directory: starter/backend/k8s
    
