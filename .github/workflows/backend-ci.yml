name: 'backend integration Pipeline'
on:
  # Manual trigger
  workflow_dispatch:

  # Automatic trigger on pull_request events
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**' # Le pipeline backend se déclenchera uniquement si le code du frontend change
jobs:
  # linting job that fails if the code contain error
  # ==========================================
  # JOB 1 : LINTING 
  # ==========================================
  lint:
    name: Run Linting job
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Ou '3.x' pour la dernière version stable

      
      # 3. Installer le linter (et les dépendances si nécessaire)
      - name: Install dependencies
        run: |
          python -m pip upgrade pip
          pip install flake8

      # 4. Exécution du linter dans le dossier backend
      # Retourne un code d'erreur (exit 1) si le code n'est pas propre
      - name: Run Flake8 Check
        run: flake8 backend/

  # ==========================================
  # JOB 2 : TESTS 
  # ==========================================

  # parallel test job that fails if test suit doesn't pass 
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installer les dépendances de l'application et pytest
      # (On suppose que tu as un fichier requirements.txt dans ton dossier backend)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      # 4. Exécuter les tests avec pytest
      # On cible explicitement le dossier backend
      - name: Run Tests with Pytest
        run: |
          pytest backend/

  # ==========================================
  # JOB 3 : BUILD DOCKER & PUSH TO ECR
  # ==========================================
  build-and-push:
    name: Build & Push Backend to Amazon ECR
    runs-on: ubuntu-latest
    needs: [lint, tests] # On attend que le linting et les tests backend soient OK
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Authentifier Docker auprès d'Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construire l'image du Backend et la pousser
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend      # CRUCIAL : On se place dans le sous-dossier backend
          file: ./backend/Dockerfile # Optionnel si ton Dockerfile s'appelle juste 'Dockerfile' et est dans ./backend
          push: true
          # On change le nom de l'image pour cibler le repo ECR du backend
          tags: ${{ steps.login-ecr.outputs.registry }}/backend:latest