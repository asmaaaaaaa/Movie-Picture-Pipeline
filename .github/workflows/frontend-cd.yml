name: 'Frontend Deployment Pipeline'
on:
  # Manual trigger
  workflow_dispatch:

  # Automatic trigger on pull_request events
  push:
    branches:
      - main
#      - movie-branch
    paths:
      - 'frontend/**'

  

jobs:
  # linting job that fails if the code contain error
  # ==========================================
  # JOB 1 : LINTING 
  # ==========================================
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      
      # 3. Installer les dépendances du projet (y compris ESLint)
      - name: Install dependencies
        run: npm ci
        working-directory: starter/frontend

      # 4. linter executuion that return exit 1 if there is an error
      - name: Run ESLint Check
        run: npm run lint
        working-directory: starter/frontend

  # ==========================================
  # JOB 2 : TESTS 
  # ==========================================

  # parallel test job that fails if test suit doesn't pass 
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    # optionnel : "needs: lint" force les tests à attendre que le linting soit réussi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: starter/frontend

      # Exécution de la suite de tests
      - name: Run Test Suite
        run: npm test -- --watchAll=false
        working-directory: starter/frontend
        env:
          CI: true

  # ==========================================
  # JOB 3 : BUILD DOCKER & PUSH TO ECR
  # ==========================================
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: [lint, tests] # On ne build l'image QUE si les tests passent !
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à AWS (Utilise les Secrets de votre dépôt GitHub)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Authentifier Docker auprès de votre registre ECR privé
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construire l'image et la pousser (C'est le bloc que nous avons vu ensemble)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: starter/frontend
          push: true # 'true' car on veut l'envoyer sur AWS maintenant
          # Récupère l'URL ECR générée dynamiquement à l'étape précédente + le nom de votre repo
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }}
  # ==========================================
  # JOB 4 : DEPLOY TO K8S
  # ==========================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      # 1. Récupérer les manifests Kubernetes depuis votre dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à AWS avec les secrets du dépôt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Configurer kubectl pour pointer vers votre cluster EKS
      # C'est ici que l'autorisation accordée par votre script init.sh devient active !
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name udacity_cluster

      # 4. Optionnel mais recommandé : Remplacer dynamiquement le tag de l'image par le Git SHA
      # Si vous utilisez Kustomize, cela met à jour votre kustomization.yaml à la volée
      - name: Set Image Tag in Kustomize
        run: |
          kustomize edit set image frontend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}
        working-directory: starter/frontend/k8s # le dossier contenant vos manifests / kustomization.yaml
        # Note : Si vous n'utilisez pas Kustomize, vous pouvez sauter cette étape ou utiliser 'sed' pour modifier votre deployment.yaml

      # 5. Appliquer les manifests sur le cluster
      - name: Deploy Manifests to Kubernetes
        run: |
          kubectl apply -k .  # Utilise Kustomize
          # OU si vous utilisez des fichiers classiques : kubectl apply -f k8s/deployment.yaml
        working-directory: starter/frontend/k8s
